<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
  <title>Win</title>
</head>
<body>
  <main class="win">
    <div class="petal" style="left:70px;top:250px;transform:rotate(-20deg);background:#E892B0"></div>
    <div class="petal" style="left:300px;top:220px;transform:rotate(30deg)"></div>
    <div class="petal" style="left:48px;top:420px;transform:rotate(12deg);background:#E892B0"></div>
    <div class="petal" style="left:320px;top:460px;transform:rotate(-28deg)"></div>
    <div class="petal" style="left:180px;top:190px;transform:rotate(8deg);background:#F4C3D4"></div>
    <div class="sheet">
      <h1>Complete</h1>
      <p style="color:var(--muted);font-weight:650">Medium</p>
      <p style="font-family:var(--serif);font-size:28px;margin:8px 0">12:40</p>
      <p style="color:var(--muted)">No hints used.</p>
      <div class="btn" style="margin-top:18px">New medium puzzle</div>
      <div class="btn quiet">Home</div>
    </div>
  </main>
</body>
</html>
