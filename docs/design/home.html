<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
  <title>Home</title>
</head>
<body>
  <main class="screen">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <h1>Sudoku</h1>
        <p class="sub">A quiet grid.</p>
      </div>
      <div style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px">⚙</div>
    </div>
    <div class="row" style="border-radius:22px">
      <div><strong>Puzzle packs</strong><span>Optional sets from the App Store</span></div>
      <div>›</div>
    </div>
    <p style="font-weight:700;margin:18px 0 8px">New puzzle</p>
    <div class="row selected"><div><strong>Easy</strong><span>Every digit has an open door.</span></div><div>✓</div></div>
    <div class="row"><div><strong>Medium</strong><span>A few digits are hiding in plain sight.</span></div></div>
    <div class="row"><div><strong>Hard</strong><span>Pairs and lines start to matter.</span></div></div>
    <div class="row"><div><strong>Expert</strong><span>The obvious moves run out.</span></div></div>
    <div class="btn">New game</div>
  </main>
</body>
</html>
